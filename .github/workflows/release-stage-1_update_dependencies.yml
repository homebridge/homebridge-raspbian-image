name: Release Stage 1 - Dependency Management - Update and Build
run-name: Release Stage 1 - Dependency Management - ${{ github.event_name == 'workflow_dispatch' && format('Manual - {0}', github.event.inputs.release-stream) || 'Scheduled' }} Run

on:
  schedule:
    # Daily updates - 6 AM Eastern (10 AM UTC), processes stable, beta and alpha streams
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      release-stream:
        description: 'Choose release stream to update and build'
        required: true
        type: choice
        options:
          - stable
          - beta
          - alpha
          - all
        default: stable
     # skip-build:
     #   description: 'Skip build and only update dependencies'
     #   required: false
     #   type: boolean
     #   default: false
      publish:
        description: 'Publish Release to RPI Imager Registry (stable only: beta and alpha are never published)'
        type: boolean
        default: true

concurrency:
  group: release-stage-1-update-dependencies
  cancel-in-progress: false
  
permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

jobs:
  define-matrix:
    name: Define Jobs Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix based on trigger
        id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.release-stream }}" == "all" ]]; then
              echo 'matrix={"stream":["stable","beta","alpha"]}' >> $GITHUB_OUTPUT
            else
              echo "matrix={\"stream\":[\"${{ github.event.inputs.release-stream }}\"]}" >> $GITHUB_OUTPUT
            fi
          else
            # Scheduled run - process stable, beta, and alpha streams
            echo 'matrix={"stream":["stable","beta","alpha"]}' >> $GITHUB_OUTPUT
          fi

      - name: Output matrix for debugging
        run: |
          echo "::notice::Dependencies Matrix: ${{ steps.set-matrix.outputs.matrix }}"

  update-dependencies:
    name: Update ${{ matrix.stream }} Dependencies
    needs: define-matrix
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        stream: ${{ fromJson(needs.define-matrix.outputs.matrix).stream }}
    steps:
      # Beta and alpha build from the newest <stream>-YYYY.M.D branch when one exists
      # (e.g. beta-2026.11.18), so unreleased features can ship to that stream without
      # touching latest. Stable, and beta/alpha without such a branch, use latest.
      - name: Resolve ${{ matrix.stream }} Branch
        id: resolve-branch
        env:
          GH_TOKEN: ${{ github.token }}
          STREAM: ${{ matrix.stream }}
        run: |
          BRANCH="latest"
          if [[ "$STREAM" == "beta" || "$STREAM" == "alpha" ]]; then
            CANDIDATE=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/${STREAM}-" \
              --jq '.[].ref | sub("^refs/heads/"; "")' \
              | grep -E "^${STREAM}-[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}$" \
              | sort -V | tail -n 1 || true)
            [[ -n "$CANDIDATE" ]] && BRANCH="$CANDIDATE"
          fi
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "::notice::${STREAM} stream builds from branch ${BRANCH}"

      - name: Create Dependency Bot App Token
        id: dependency-bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPENDENCY_BOT_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          owner: homebridge
          repositories: homebridge-raspbian-image
          permission-contents: write

      - name: Update Dependencies ${{ matrix.stream }}
        id: homebridge-bot
        uses: homebridge/dependency-bot@latest
        with:
          config_file: '.github/homebridge-dependency-bot-${{ matrix.stream }}.json'
          release_stream: ${{ matrix.stream }}
          base_branch: ${{ steps.resolve-branch.outputs.branch }}
          PUBLISH_TOKEN: ${{ steps.dependency-bot-token.outputs.token }}  # GitHub App on latest's bypass list, for direct pushes
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Log Skipped ${{ matrix.stream }} Stage 2 Trigger
        if: steps.homebridge-bot.outputs.changes_detected != 'true' || steps.homebridge-bot.outputs.auto_merge != 'true'
        run: |
          echo "::warning::${{ matrix.stream }} Stage 2 not triggered: Changes Detected=${{ steps.homebridge-bot.outputs.changes_detected }}, Auto Merge=${{ steps.homebridge-bot.outputs.auto_merge }}"
  
      - name: Checkout repository (for trigger step)
        if: steps.homebridge-bot.outputs.changes_detected == 'true' && steps.homebridge-bot.outputs.auto_merge == 'true'
        uses: actions/checkout@v7

      - name: Trigger and Wait for ${{ matrix.stream }} Stage 2 Workflow
        if: steps.homebridge-bot.outputs.changes_detected == 'true' && steps.homebridge-bot.outputs.auto_merge == 'true'
        uses: ./.github/actions/trigger-and-wait-workflow
        with:
          workflow-file: 'create_raspbian_pi-gen.yml'
          ref: ${{ steps.resolve-branch.outputs.branch }}
          github-token: ${{ secrets.GH_TOKEN }}
          timeout-minutes: '120'
          workflow-fields: |
            release-stream=${{ matrix.stream }}
            Scheduled=${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Scheduled' }}
            publish=${{ matrix.stream == 'stable' && (github.event.inputs.publish || 'true') || 'false' }}
          run-name: "${{ matrix.stream }}:${{ github.run_id }}"
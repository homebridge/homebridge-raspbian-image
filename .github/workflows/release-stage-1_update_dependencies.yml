name: Release Stage 1 - Dependency Management - Update and Build
run-name: Release Stage 1 - Dependency Management - ${{ github.event_name == 'workflow_dispatch' && format('Manual - {0}', github.event.inputs.release-stream) || 'Scheduled' }} Run

on:
  schedule:
    # Daily, at 10:23 UTC. This repo has one stream: stable.
    # Not on the full hour: that is when GitHub is busiest, and scheduled runs then start hours late.
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      release-stream:
        description: 'Choose release stream to update and build'
        required: true
        type: choice
        options:
          - stable
        default: stable
      publish:
        description: 'Publish Release to RPI Imager Registry'
        type: boolean
        default: true

concurrency:
  group: release-stage-1-update-dependencies
  cancel-in-progress: false
  
# No rights by default. Each job below asks for what it needs.
permissions: {}

jobs:
  define-matrix:
    name: Define Jobs Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix based on trigger
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_STREAM: ${{ github.event.inputs.release-stream }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "matrix=$(jq -cn --arg stream "$RELEASE_STREAM" '{stream: [$stream]}')" >> "$GITHUB_OUTPUT"
          else
            # Scheduled run - this repo has one stream: stable
            echo 'matrix={"stream":["stable"]}' >> "$GITHUB_OUTPUT"
          fi

      - name: Output matrix for debugging
        env:
          MATRIX: ${{ steps.set-matrix.outputs.matrix }}
        run: |
          echo "::notice::Dependencies Matrix: ${MATRIX}"

  update-dependencies:
    name: Update ${{ matrix.stream }} Dependencies
    needs: define-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout. The bot pushes with its own App token, made in the first step.
      actions: write  # start the Stage 2 workflow and read its state
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        stream: ${{ fromJson(needs.define-matrix.outputs.matrix).stream }}
    steps:
      - name: Create Dependency Bot App Token
        id: dependency-bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPENDENCY_BOT_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          owner: homebridge
          repositories: homebridge-raspbian-image
          permission-contents: write

      - name: Update Dependencies ${{ matrix.stream }}
        id: homebridge-bot
        uses: homebridge/dependency-bot@latest
        with:
          config_file: '.github/homebridge-dependency-bot-${{ matrix.stream }}.json'
          release_stream: ${{ matrix.stream }}
          # GitHub App on latest's bypass list, for direct pushes. The bot config uses
          # "update_method": "push", so the bot needs no second token (the old personal access
          # token was only used to approve and merge pull requests).
          PUBLISH_TOKEN: ${{ steps.dependency-bot-token.outputs.token }}

      # The full history and the tags are needed to compare with the newest release.
      # The branch tip is checked out, so a push the bot just made is included.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Decide whether to build
        id: plan
        env:
          STREAM: ${{ matrix.stream }}
          CHANGES_DETECTED: ${{ steps.homebridge-bot.outputs.changes_detected }}
          AUTO_MERGE: ${{ steps.homebridge-bot.outputs.auto_merge }}
        run: |
          # true when the versions on the branch are not in the newest release, for example
          # because the build that should have released them failed
          UNRELEASED="$(./scripts/unreleased-versions.sh "$STREAM")"

          BUILD=false
          if [[ "$AUTO_MERGE" != "true" ]]; then
            echo "::warning::${STREAM} Stage 2 not triggered: the bot does not merge by itself (Auto Merge=${AUTO_MERGE})"
          elif [[ "$CHANGES_DETECTED" == "true" ]]; then
            echo "::notice::${STREAM}: the bot found new versions, starting a build"
            BUILD=true
          elif [[ "$UNRELEASED" == "true" ]]; then
            echo "::notice::${STREAM}: the versions on the branch were never released, starting a build"
            BUILD=true
          else
            echo "::notice::${STREAM} Stage 2 not triggered: nothing new (Changes Detected=${CHANGES_DETECTED})"
          fi
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"

      # This step fails when the build fails or takes too long, so this workflow run shows red.
      - name: Trigger and Wait for ${{ matrix.stream }} Stage 2 Workflow
        if: steps.plan.outputs.build == 'true'
        uses: ./.github/actions/trigger-and-wait-workflow
        with:
          workflow-file: 'create_raspbian_pi-gen.yml'
          ref: ${{ github.ref_name }}
          github-token: ${{ github.token }}
          timeout-minutes: '180'
          workflow-fields: |
            release-stream=${{ matrix.stream }}
            Scheduled=${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Scheduled' }}
            publish=${{ github.event.inputs.publish || 'true' }}
          run-name: "${{ matrix.stream }}:${{ github.run_id }}"

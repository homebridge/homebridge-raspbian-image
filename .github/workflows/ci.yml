name: CI

on:
  pull_request:

# no rights by default; each job asks for what it needs
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Script tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # The same Debian release as the image, so sh, sed, jq and nginx behave as they do on a Pi.
    # The image is named by its digest, so it can not change without a commit here.
    # To update: docker pull debian:trixie-slim, then copy the new digest.
    container:
      image: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    steps:
      - name: Install the tools the tests use
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            bash ca-certificates dash git jq nginx openssl python3 > /dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the tests
        run: tests/run.sh

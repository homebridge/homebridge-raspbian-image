name: PR Labeler

on:
  pull_request_target: # required for auto labeler
    types: [opened, reopened, synchronize]
  workflow_dispatch:

# No rights by default. The job below asks for what the shared workflow needs.
permissions: {}

jobs:
  label:
    permissions:
      contents: read
      pull-requests: write
    uses: homebridge/.github/.github/workflows/pr-labeler.yml@latest
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

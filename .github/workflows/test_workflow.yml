name: Test Workflow
run-name: Test pi-gen with release ${{ inputs.release }} and ${{ inputs.pi-gen-version }} pi-gen branch

on:
  workflow_dispatch:
    inputs:
      pi-gen-version:
        description: 'pi-gen branch to use'
        required: true
        default: arm64
        type: string
      release:
        description: 'Raspberry Pi OS release to build'
        required: true
        default: trixie
        type: string

jobs:
  pi-gen-verbose:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p fix-stage &&
          {
          cat > fix-stage/prerun.sh <<-'EOF'
          #!/bin/bash
          set -e
          
          echo "=== Downloading verified Raspberry Pi GPG keyring ==="
          echo ""
          echo "Source: https://github.com/homebridge/homebridge-raspbian-image"
          echo "Branch: Update-Build-Process"
          echo "Contains: Raspberry Pi Archive Signing Key + Mike Thompson's key (Raspbian)"
          echo ""
          
          # Download the verified keyring file from GitHub
          KEYRING_URL="https://github.com/homebridge/homebridge-raspbian-image/raw/refs/heads/Update-Build-Process/stage0_prep/files/raspberrypi.gpg"
          
          echo "Downloading keyring from: $KEYRING_URL"
          wget -q "$KEYRING_URL" -O raspberrypi.gpg || {
            echo "Error: Failed to download keyring from $KEYRING_URL"
            exit 1
          }
          
          ls -lR ../../..
          
          # Verify the file was downloaded and is not empty
          if [ ! -s raspberrypi.gpg ]; then
            echo "Error: Downloaded keyring is empty"
            exit 1
          fi
          
          KEYRING_SIZE=$(stat -c%s raspberrypi.gpg 2>/dev/null || stat -f%z raspberrypi.gpg)
          echo "✓ Downloaded keyring: $KEYRING_SIZE bytes"
          
          # Display keyring info
          echo ""
          echo "=== Keyring contents ==="
          apt-get update -qq
          apt-get install -y -qq gnupg
          gpg --import-options show-only --import raspberrypi.gpg 2>&1 | grep -E "(pub|uid)" || true
          
          # Verify digest algorithms
          SHA256_COUNT=$(gpg --list-packets raspberrypi.gpg 2>&1 | grep -c "digest algo 8" || echo "0")
          echo ""
          echo "Digest algorithm check: SHA256 signatures found: $SHA256_COUNT"
          if [ "$SHA256_COUNT" -ge 2 ]; then
            echo "✓ Keyring contains required SHA256 signatures"
          else
            echo "⚠️  WARNING: Keyring missing SHA256 signatures - build may fail"
          fi
          
          # Install keyring
          echo ""
          echo "Installing GPG keyring to stage0/files..."
          mkdir -p ../pi-gen/stage0/files
          cp raspberrypi.gpg ../pi-gen/stage0/files/raspberrypi.gpg
          
          echo "✓ GPG keyring installed successfully"
          ls -lh ../pi-gen/stage0/files/raspberrypi.gpg
          EOF
          } &&
          chmod +x fix-stage/prerun.sh

      - uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: test
          verbose-output: true
          pi-gen-version: ${{ inputs.pi-gen-version }}
          release: ${{ inputs.release }}
          stage-list: fix-stage stage0 stage1 stage2

      - uses: actions/upload-artifact@v4
        with:
          name: pi-gen-image
          path: ${{ steps.build.outputs.image-path }}
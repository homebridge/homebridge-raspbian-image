name: Test Workflow
run-name: Test pi-gen with release ${{ inputs.release }} and ${{ inputs.pi-gen-version }} pi-gen branch

on:
  workflow_dispatch:
    inputs:
      pi-gen-version:
        description: 'pi-gen branch to use'
        required: true
        default: arm64
        type: string
      release:
        description: 'Raspberry Pi OS release to build'
        required: true
        default: trixie
        type: string

jobs:
  pi-gen-verbose:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p fix-stage &&
          {
          cat > fix-stage/prerun.sh <<-'EOF'
          #!/bin/bash
          set -e
          
          # Download the package index to find the latest version
          echo "Fetching latest raspberrypi-archive-keyring package..."
          POOL_URL="http://archive.raspberrypi.org/debian/pool/main/r/raspberrypi-archive-keyring"
          
          # Get the directory listing and extract the latest .deb filename
          LATEST_DEB=$(wget -q -O - "$POOL_URL/" | grep -oP 'raspberrypi-archive-keyring_[^"]+_all\.deb' | sort -V | tail -1)
          
          if [ -z "$LATEST_DEB" ]; then
            echo "Error: Could not find raspberrypi-archive-keyring package"
            exit 1
          fi
          
          echo "Found latest package: $LATEST_DEB"
          
          # Download the package
          wget -q "$POOL_URL/$LATEST_DEB"
          
          # Verify the package was downloaded
          if [ ! -f "$LATEST_DEB" ]; then
            echo "Error: Failed to download $LATEST_DEB"
            exit 1
          fi
          
          # Extract the package
          echo "Extracting keyring package..."
          ar x "$LATEST_DEB"
          tar xf data.tar.gz
          
          # Copy the GPG key from the extracted package
          echo "Installing GPG key to stage0/files..."
          mkdir -p ../pi-gen/stage0/files
          
          # The keyring package contains .pgp files (raspberrypi-archive-keyring.gpg is a symlink)
          # Copy the actual .pgp file and rename it to .gpg for pi-gen
          if [ -f usr/share/keyrings/raspberrypi-archive-keyring.pgp ]; then
            cp usr/share/keyrings/raspberrypi-archive-keyring.pgp ../pi-gen/stage0/files/raspberrypi.gpg
          elif [ -f usr/share/keyrings/raspberrypi-archive-keyring.gpg ]; then
            # Fallback to symlink target if structure changes
            cp usr/share/keyrings/raspberrypi-archive-keyring.gpg ../pi-gen/stage0/files/raspberrypi.gpg
          else
            echo "Error: GPG key not found in keyring package"
            exit 1
          fi
          
          # Verify the copy was successful
          if [ ! -s ../pi-gen/stage0/files/raspberrypi.gpg ]; then
            echo "Error: Failed to copy GPG key to stage0/files"
            exit 1
          fi
          
          echo "GPG key successfully installed"
          ls -lh ../pi-gen/stage0/files/raspberrypi.gpg
          
          # Cleanup
          rm -f "$LATEST_DEB" control.tar.xz data.tar.gz debian-binary
          rm -rf usr
          EOF
          } &&
          chmod +x fix-stage/prerun.sh

      - uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: test
          verbose-output: true
          pi-gen-version: ${{ inputs.pi-gen-version }}
          release: ${{ inputs.release }}
          stage-list: fix-stage stage0 stage1 stage2

      - uses: actions/upload-artifact@v4
        with:
          name: pi-gen-image
          path: ${{ steps.build.outputs.image-path }}
name: Test Workflow
run-name: Test pi-gen with release ${{ inputs.release }} and ${{ inputs.pi-gen-version }} pi-gen branch

on:
  workflow_dispatch:
    inputs:
      pi-gen-version:
        description: 'pi-gen branch to use'
        required: true
        default: arm64
        type: string
      release:
        description: 'Raspberry Pi OS release to build'
        required: true
        default: trixie
        type: string

jobs:
  pi-gen-verbose:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p fix-stage &&
          {
          cat > fix-stage/prerun.sh <<-'EOF'
          #!/bin/bash
          set -e
          
          # Download the official Raspberry Pi Archive Signing Key
          echo "Downloading official Raspberry Pi Archive Signing Key..."
          wget -q -O raspberrypi.gpg http://archive.raspberrypi.org/debian/raspberrypi.gpg.key
          
          # Verify the file was downloaded and is not empty
          if [ ! -s raspberrypi.gpg ]; then
            echo "Error: Failed to download GPG key or file is empty"
            exit 1
          fi
          
          # Convert from ASCII armored to binary format if needed
          # if file raspberrypi.gpg | grep -q "PGP public key"; then
          #  echo "GPG key is already in binary format"
          #elif file raspberrypi.gpg | grep -q "ASCII"; then
            echo "Converting ASCII armored key to binary format..."
            gpg --dearmor < raspberrypi.gpg > raspberrypi.gpg.tmp
            mv raspberrypi.gpg.tmp raspberrypi.gpg
          #fi
          
          # Ensure target directory exists
          echo "Installing GPG key to stage0/files..."
          mkdir -p ../pi-gen/stage0/files
          cp raspberrypi.gpg ../pi-gen/stage0/files/raspberrypi.gpg
          
          # Verify the copy was successful
          if [ ! -s ../pi-gen/stage0/files/raspberrypi.gpg ]; then
            echo "Error: Failed to copy GPG key to stage0/files"
            exit 1
          fi
          
          echo "GPG key successfully installed"
          ls -lh ../pi-gen/stage0/files/raspberrypi.gpg
          EOF
          } &&
          chmod +x fix-stage/prerun.sh

      - uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: test
          verbose-output: true
          pi-gen-version: ${{ inputs.pi-gen-version }}
          release: ${{ inputs.release }}
          stage-list: fix-stage stage0 stage1 stage2

      - uses: actions/upload-artifact@v4
        with:
          name: pi-gen-image
          path: ${{ steps.build.outputs.image-path }}
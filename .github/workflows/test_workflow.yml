name: Test Workflow
run-name: Test pi-gen with release ${{ inputs.release }} and ${{ inputs.pi-gen-version }} pi-gen branch

on:
  workflow_dispatch:
    inputs:
      pi-gen-version:
        description: 'pi-gen branch to use'
        required: true
        default: arm64
        type: string
      release:
        description: 'Raspberry Pi OS release to build'
        required: true
        default: trixie
        type: string

jobs:
  pi-gen-verbose:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p fix-stage &&
          {
          cat > fix-stage/prerun.sh <<-EOF
          #!/bin/bash
          wget https://github.com/RPi-Distro/pi-gen/raw/676ba8a7476bd5923e5b677473b11ba52b21c6bd/stage0/files/raspberrypi.gpg
          pwd
          ls -lR ..
          cp raspberrypi.gpg ../stage0/files/raspberrypi.gpg
          EOF
          } &&
          chmod +x fix-stage/prerun.sh

      - uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: test
          verbose-output: true
          pi-gen-version: ${{ inputs.pi-gen-version }}
          release: ${{ inputs.release }}
          stage-list: fix-stage stage0 stage1 stage2

      - uses: actions/upload-artifact@v4
        with:
          name: pi-gen-image
          path: ${{ steps.build.outputs.image-path }}
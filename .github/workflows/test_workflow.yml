name: Test Workflow
run-name: Test pi-gen with release ${{ inputs.release }} and ${{ inputs.pi-gen-version }} pi-gen branch

on:
  workflow_dispatch:
    inputs:
      pi-gen-version:
        description: 'pi-gen branch to use'
        required: true
        default: master
        type: string
      release:
        description: 'Raspberry Pi OS release to build'
        required: true
        default: trixie
        type: string

jobs:
  pi-gen-verbose:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p fix-stage &&
          {
          cat > fix-stage/prerun.sh <<-'EOF'
          #!/bin/bash
          set -e
          
          echo "=== Adding Raspbian keyring to pi-gen's existing GPG keyring ==="
          echo ""
          
          # Install required tools
          apt-get update -qq
          apt-get install -y -qq wget gnupg binutils
          
          # Step 1: Verify existing pi-gen keyring
          echo "Step 1: Checking existing pi-gen keyring..."
          if [ ! -f ../pi-gen/stage0/files/raspberrypi.gpg ]; then
            echo "Error: Expected keyring not found at ../pi-gen/stage0/files/raspberrypi.gpg"
            exit 1
          fi
          
          PIGEN_SIZE=$(stat -c%s ../pi-gen/stage0/files/raspberrypi.gpg)
          echo "✓ Found existing pi-gen keyring: $PIGEN_SIZE bytes"
          
          # Backup original keyring
          cp ../pi-gen/stage0/files/raspberrypi.gpg /tmp/pigen-keyring-original.gpg
          
          # Step 2: Download and extract raspbian-archive-keyring package (Mike Thompson's key with SHA256)
          echo ""
          echo "Step 2: Downloading latest raspbian-archive-keyring package..."
          RASPBIAN_POOL_URL="http://archive.raspbian.org/raspbian/pool/main/r/raspbian-archive-keyring"
          
          # Get the latest version
          LATEST_DEB=$(wget -q -O - "$RASPBIAN_POOL_URL/" | grep -oP 'raspbian-archive-keyring_[^"]+_all\.deb' | sort -V | tail -1)
          
          if [ -z "$LATEST_DEB" ]; then
            echo "Error: Could not find raspbian-archive-keyring package"
            exit 1
          fi
          
          echo "Found latest package: $LATEST_DEB"
          wget -q "$RASPBIAN_POOL_URL/$LATEST_DEB" -O /tmp/raspbian-keyring.deb || {
            echo "Error: Failed to download raspbian-archive-keyring package"
            exit 1
          }
          
          # Extract the keyring
          echo "Extracting raspbian-archive-keyring.gpg..."
          cd /tmp
          ar x raspbian-keyring.deb
          
          if [ -f data.tar.gz ]; then
            tar -xzf data.tar.gz ./usr/share/keyrings/raspbian-archive-keyring.gpg
          elif [ -f data.tar.xz ]; then
            tar -xJf data.tar.xz ./usr/share/keyrings/raspbian-archive-keyring.gpg
          elif [ -f data.tar.zst ]; then
            tar --zstd -xf data.tar.zst ./usr/share/keyrings/raspbian-archive-keyring.gpg
          else
            echo "Error: Could not find data archive in .deb package"
            exit 1
          fi
          
          RASPBIAN_SIZE=$(stat -c%s /tmp/usr/share/keyrings/raspbian-archive-keyring.gpg)
          echo "✓ Extracted raspbian-archive-keyring.gpg: $RASPBIAN_SIZE bytes"
          
          # Step 3: Combine both keyrings
          echo ""
          echo "Step 3: Combining keyrings..."
          cat /tmp/pigen-keyring-original.gpg /tmp/usr/share/keyrings/raspbian-archive-keyring.gpg > /tmp/combined.gpg
          
          COMBINED_SIZE=$(stat -c%s /tmp/combined.gpg)
          echo "✓ Created combined keyring: $COMBINED_SIZE bytes"
          
          # Step 4: Validate the combined keyring
          echo ""
          echo "Step 4: Validating combined keyring..."
          
          # Verify it contains both keys
          KEY_COUNT=$(gpg --with-colons --import-options show-only --import /tmp/combined.gpg 2>&1 | grep -c "^pub:" || echo "0")
          echo "Total keys in combined keyring: $KEY_COUNT"
          
          if [ "$KEY_COUNT" -ne 3 ]; then
            echo "Error: Expected 2 keys but found $KEY_COUNT"
            exit 1
          fi
          
          # Verify SHA256 signatures are present
          SHA256_COUNT=$(gpg --list-packets /tmp/combined.gpg 2>&1 | grep -c "digest algo 8" || echo "0")
          echo "SHA256 signatures found: $SHA256_COUNT"
          
          if [ "$SHA256_COUNT" -lt 2 ]; then
            echo "Error: Expected at least 2 SHA256 signatures but found $SHA256_COUNT"
            exit 1
          fi
          
          # Display key details
          echo ""
          echo "Combined keyring contents:"
          gpg --import-options show-only --import /tmp/combined.gpg 2>&1 | grep -E "(pub|uid)"
          
          # Step 5: Replace pi-gen keyring with combined version
          echo ""
          echo "Step 5: Replacing pi-gen keyring with combined version..."
          cp /tmp/combined.gpg ../pi-gen/stage0/files/raspberrypi.gpg
          
          echo "✓ GPG keyring replaced successfully"
          ls -lh ../pi-gen/stage0/files/raspberrypi.gpg
          
          # Cleanup
          rm -rf /tmp/pigen-keyring-original.gpg /tmp/raspbian-keyring.deb /tmp/combined.gpg /tmp/usr /tmp/data.tar.*
          
          echo ""
          echo "=== Keyring update complete ==="
          echo "Original pi-gen keyring:  $PIGEN_SIZE bytes (Raspberry Pi Archive key)"
          echo "Raspbian keyring:         $RASPBIAN_SIZE bytes (Mike Thompson's key with SHA256)"
          echo "Combined keyring:         $COMBINED_SIZE bytes (both keys with SHA256 signatures)"
          EOF
          } &&
          chmod +x fix-stage/prerun.sh

      - uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: test
          verbose-output: true
          pi-gen-version: ${{ inputs.pi-gen-version }}
          release: ${{ inputs.release }}
          stage-list: fix-stage stage0 stage1 stage2

      - uses: actions/upload-artifact@v4
        with:
          name: pi-gen-image
          path: ${{ steps.build.outputs.image-path }}
name: Test Workflow
run-name: Test pi-gen with release ${{ inputs.release }} and ${{ inputs.pi-gen-version }} pi-gen branch

on:
  workflow_dispatch:
    inputs:
      pi-gen-version:
        description: 'pi-gen branch to use'
        required: true
        default: arm64
        type: string
      release:
        description: 'Raspberry Pi OS release to build'
        required: true
        default: trixie
        type: string

jobs:
  pi-gen-verbose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - run: |
          mkdir -p fix-stage &&
          {
          cat > fix-stage/prerun.sh <<-'EOF'
          #!/bin/bash
          set -e
          
          echo "=== Installing verified Raspberry Pi GPG keyring ==="
          echo ""
          echo "Using pre-verified keyring with SHA256 signatures from repository."
          echo "Contains: Raspberry Pi Archive Signing Key + Mike Thompson's key (Raspbian)"
          echo ""
          
          # Verify the committed keyring file exists
          if [ ! -f ../stage0_prep/files/raspberrypi.gpg ]; then
            echo "Error: Verified keyring not found at ../stage0_prep/files/raspberrypi.gpg"
            echo "This file must be committed to the repository."
            exit 1
          fi
          
          # Install keyring
          echo "Installing GPG keyring to stage0/files..."
          mkdir -p ../pi-gen/stage0/files
          cp ../stage0_prep/files/raspberrypi.gpg ../pi-gen/stage0/files/raspberrypi.gpg
          
          # Validate installation
          KEYRING_SIZE=$(stat -c%s ../pi-gen/stage0/files/raspberrypi.gpg 2>/dev/null || stat -f%z ../pi-gen/stage0/files/raspberrypi.gpg)
          echo "✓ GPG keyring installed: $KEYRING_SIZE bytes"
          
          # Display keyring info
          echo ""
          echo "=== Keyring contents ==="
          apt-get update -qq
          apt-get install -y -qq gnupg
          gpg --import-options show-only --import ../pi-gen/stage0/files/raspberrypi.gpg 2>&1 | grep -E "(pub|uid)" || true
          
          # Verify digest algorithms
          SHA256_COUNT=$(gpg --list-packets ../pi-gen/stage0/files/raspberrypi.gpg 2>&1 | grep -c "digest algo 8" || echo "0")
          echo ""
          echo "Digest algorithm check: SHA256 signatures found: $SHA256_COUNT"
          if [ "$SHA256_COUNT" -ge 2 ]; then
            echo "✓ Keyring contains required SHA256 signatures"
          else
            echo "⚠️  WARNING: Keyring missing SHA256 signatures - build may fail"
          fi
          
          ls -lh ../pi-gen/stage0/files/raspberrypi.gpg
          EOF
          } &&
          chmod +x fix-stage/prerun.sh

      - uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: test
          verbose-output: true
          pi-gen-version: ${{ inputs.pi-gen-version }}
          release: ${{ inputs.release }}
          stage-list: fix-stage stage0 stage1 stage2

      - uses: actions/upload-artifact@v4
        with:
          name: pi-gen-image
          path: ${{ steps.build.outputs.image-path }}
name: 'Trigger and Wait for Workflow'
description: 'Triggers a workflow, waits for it to finish, and fails unless it finished with success'
inputs:
  workflow-file:
    description: 'The workflow file to trigger (e.g., release-stage-2_build_and_release.yml)'
    required: true
  ref:
    description: 'The git ref to run the workflow on'
    required: true
    default: 'latest'
  github-token:
    description: 'GitHub token for authentication'
    required: true
  timeout-minutes:
    description: 'Maximum wait time in minutes'
    required: false
    default: '30'
  run-name:
    description: 'Unique name of the triggered workflow run. The workflow must take it as its run_name input and show it in its run-name.'
    required: true
  workflow-fields:
    description: 'Fields to pass to the workflow, one key=value per line'
    required: false
    default: ''

outputs:
  workflow-conclusion:
    description: 'The conclusion of the triggered workflow'
    value: ${{ steps.wait-completion.outputs.conclusion }}
  run-id:
    description: 'The run ID of the triggered workflow'
    value: ${{ steps.find-workflow.outputs.run_id }}

runs:
  using: 'composite'
  steps:
    - name: Trigger ${{ inputs.run-name }} Workflow
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
        WORKFLOW_REF: ${{ inputs.ref }}
        RUN_NAME: ${{ inputs.run-name }}
        WORKFLOW_FIELDS: ${{ inputs.workflow-fields }}
      run: |
        echo "::notice::Triggering ${RUN_NAME} workflow - ${WORKFLOW_FILE}"

        # Build the --field arguments from the key=value lines
        FIELD_ARGS=(--field "run_name=${RUN_NAME}")
        while IFS='=' read -r key value; do
          # Only add if both key and value are non-empty
          if [[ -n "$key" && -n "$value" ]]; then
            FIELD_ARGS+=(--field "${key}=${value}")
          fi
        done <<< "$WORKFLOW_FIELDS"

        echo "::notice::Using fields: ${FIELD_ARGS[*]}"

        if ! gh workflow run "$WORKFLOW_FILE" --ref "$WORKFLOW_REF" "${FIELD_ARGS[@]}"; then
          echo "::error::Failed to trigger ${WORKFLOW_FILE} workflow"
          exit 1
        fi

        echo "::notice::${RUN_NAME} workflow triggered successfully"

    - name: Find ${{ inputs.run-name }} Workflow Run
      id: find-workflow
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
        WORKFLOW_REF: ${{ inputs.ref }}
        RUN_NAME: ${{ inputs.run-name }}
      run: |
        echo "::group::Waiting for ${RUN_NAME} workflow to appear in run list..."

        RUN_ID=""
        MAX_RETRIES=12  # Retry for up to 1 minute (12 retries * 5 seconds)
        RETRY_COUNT=0

        # The run is found by its unique name, so a run that was started earlier is never picked.
        while [[ -z "$RUN_ID" ]]; do
          if [[ $RETRY_COUNT -ge $MAX_RETRIES ]]; then
            echo "::error::Could not find triggered ${RUN_NAME} workflow run after 1 minute"
            gh run list --workflow "$WORKFLOW_FILE" --event workflow_dispatch --branch "$WORKFLOW_REF" --limit 5 --json url,name || true
            exit 1
          fi

          RETRY_COUNT=$((RETRY_COUNT + 1))

          RUN_ID=$(gh run list --workflow "$WORKFLOW_FILE" \
            --event workflow_dispatch \
            --branch "$WORKFLOW_REF" \
            --limit 10 \
            --json databaseId,name | jq -r --arg name "$RUN_NAME" '[.[] | select(.name | contains($name))][0].databaseId // empty') || RUN_ID=""

          if [[ -z "$RUN_ID" ]]; then
            echo "::notice::Retry $RETRY_COUNT/$MAX_RETRIES: ${RUN_NAME} workflow not found. Retrying in 5 seconds..."
            sleep 5
          fi
        done

        echo "::endgroup::"
        echo "::notice::Found ${RUN_NAME} workflow run: ${RUN_ID}"
        echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

    # Fails this step (and so the calling job) unless the run finished with "success".
    - name: Wait for ${{ inputs.run-name }} Workflow Completion
      id: wait-completion
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RUN_ID: ${{ steps.find-workflow.outputs.run_id }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
      run: |
        "${GITHUB_ACTION_PATH}/wait-for-run.sh" "$RUN_ID" "$TIMEOUT_MINUTES"
